name: videira

on:
  pull_request:   # every PR: jobs below skip themselves when videira is untouched, and
                  # skipped jobs still satisfy main's required checks (a path filter here would not)
  push:
    branches: [ main ]
    paths: [ "apps/videira/**", ".github/workflows/videira.yml" ]

defaults:
  run:
    working-directory: apps/videira

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      videira: ${{ github.event_name == 'push' || steps.filter.outputs.videira == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.number }} --repo ${{ github.repository }} --name-only \
            | grep -qE '^(apps/videira/|\.github/workflows/videira\.yml)' && r=true || r=false
          echo "videira=$r" >> "$GITHUB_OUTPUT"

  scan_ruby:
    needs: changes
    if: needs.changes.outputs.videira == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/videira
      - name: Brakeman
        run: bin/brakeman --no-pager
      - name: bundler-audit
        run: bin/bundler-audit

  scan_js:
    needs: changes
    if: needs.changes.outputs.videira == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/videira
      - name: importmap audit
        run: bin/importmap audit

  lint:
    needs: changes
    if: needs.changes.outputs.videira == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/videira
      - name: RuboCop
        run: bin/rubocop -f github

  test:
    needs: changes
    if: needs.changes.outputs.videira == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7   # first: working-directory (apps/videira) must exist
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/videira
      - name: Tests
        env:
          RAILS_ENV: test
          DB_PORT: 5432
        run: bin/rails db:test:prepare test
